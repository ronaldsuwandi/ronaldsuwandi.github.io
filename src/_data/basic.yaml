headline: >
  Seasoned engineer with 16+ years of experience designing and delivering high-throughput 
  backend and data systems. Proficient in Java, Golang, JavaScript, and Kafka, with 
  additional hands-on Rust through real-world projects including a load balancer, a NATS 
  server and a chess engine. Proven success in aligning complex technical solutions with 
  business goals, solving critical challenges, and collaborating with cross-functional 
  teams in fast-paced environments. Father of two wonderful sons based in Singapore

